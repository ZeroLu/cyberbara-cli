[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cyberbara-cli"
version = "0.1.0"
description = "CLI for CyberBara image, video, audio, and music generation"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "Zero Lu", email = "zerolu.eth@gmail.com" }
]
dependencies = []
keywords = ["cyberbara", "cli", "image generation", "video generation", "audio generation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12"
]

[project.scripts]
cyberbara = "cyberbara_cli.cli:main"

[project.urls]
Homepage = "https://cyberbara.com"
Repository = "https://github.com/ZeroLu/cyberbara-cli"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
